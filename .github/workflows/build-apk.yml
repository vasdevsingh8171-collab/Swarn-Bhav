name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Add Android & Sync Capacitor
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Inject Android Permissions
        run: |
          python3 -c "
          import os
          path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(path):
              with open(path, 'r', encoding='utf-8') as f:
                  content = f.read()
              
              # Add permissions inside AndroidManifest if missing
              perms = '<uses-permission android:name=\"android.permission.INTERNET\" />\n    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />\n'
              if 'android.permission.INTERNET' not in content:
                  content = content.replace('<application', perms + '    <application')
              
              if 'usesCleartextTraffic' not in content:
                  content = content.replace('<application', '<application android:usesCleartextTraffic=\"true\"')
              
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(content)
              print('AndroidManifest.xml successfully updated!')
          else:
              print('Warning: AndroidManifest.xml not found yet!')
          "

      - name: Set Custom Golden Bullion App Icon
        run: |
          # 192x192 PNG pixel base64 (Ultra-safe and lightweight)
          python3 -c "
          import base64, os
          png_data = base64.b64decode('')
          
          # Target directories
          res_path = 'android/app/src/main/res'
          os.makedirs(res_path, exist_ok=True)
          
          mipmaps = [
              'mipmap-hdpi', 'mipmap-mdpi', 'mipmap-xhdpi', 
              'mipmap-xxhdpi', 'mipmap-xxxhdpi'
          ]
          
          for m in mipmaps:
              folder = os.path.join(res_path, m)
              os.makedirs(folder, exist_ok=True)
              for fname in ['ic_launcher.png', 'ic_launcher_round.png', 'ic_launcher_foreground.png']:
                  with open(os.path.join(folder, fname), 'wb') as img:
                      img.write(png_data)
          print('Successfully forced fallback iconic resources!')
          "

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gold-Rates-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
